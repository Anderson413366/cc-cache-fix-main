name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install pinned Claude Code runtime
        run: npm ci --prefix node --ignore-scripts

      - name: Audit npm dependency
        run: npm audit --prefix node --omit=dev --audit-level=high

      - name: Python syntax check
        run: python -m py_compile patches/apply-patches.py test_cache.py usage_audit.py tracker/collector.py tracker/dashboard.py tracker/db.py

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Shell syntax check
        run: |
          bash -n install.sh
          bash -n install-mac.sh
          bash -n smoke_check.sh
